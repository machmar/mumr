<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUMR jenga: PC view</title>
<style>
  body { margin: 0; background: #0f0c0a; color: #efe4d2; font: 14px/1.45 "Zen Kaku Gothic New", system-ui, sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 18px; bottom: 14px; margin: 0; color: rgba(239, 228, 210, 0.55); font: 12px/1.5 "Zen Kaku Gothic New", system-ui, sans-serif; letter-spacing: 0.04em; white-space: pre-wrap; pointer-events: none; }
  #help { position: fixed; right: 18px; bottom: 14px; margin: 0; color: rgba(239, 228, 210, 0.38); font: 12px/1.5 "Zen Kaku Gothic New", system-ui, sans-serif; letter-spacing: 0.04em; text-align: right; pointer-events: none; }
  #help b { color: rgba(239, 228, 210, 0.6); font-weight: 500; }
  .dir { position: fixed; left: 18px; top: 16px; width: 230px; padding: 12px 14px 10px; border-radius: 10px; background: rgba(20, 15, 12, 0.55); backdrop-filter: blur(6px); border: 1px solid rgba(201, 162, 90, 0.18); pointer-events: none; font: 12px/1.5 "Zen Kaku Gothic New", system-ui, sans-serif; color: rgba(239, 228, 210, 0.75); }
  .dir .k { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(239, 228, 210, 0.45); }
  .dir .scene { font: 700 20px/1.2 "Shippori Mincho B1", Georgia, serif; color: #f0c98a; margin: 1px 0 8px; }
  .dir .bar { height: 3px; border-radius: 2px; background: rgba(239, 228, 210, 0.1); margin: 3px 0 8px; overflow: hidden; }
  .dir .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8fb79a, #f0c98a, #e0623a); }
  .dir .m { color: #f0d6aa; margin-top: 3px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script src="/mumr/all.js"></script>
<script src="spec.js"></script>
<script src="rules.js"></script>
<script src="net.js"></script>
<script src="logic.js"></script>
<script src="music.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<pre id="hud"></pre>
<p id="help"><b>drag</b> turn &nbsp; <b>wheel</b> zoom &nbsp; <b>right drag</b> move &nbsp; <b>1 2 3 4</b> tower, console, room, player &nbsp; <b>M</b> music</p>
<script type="module" src="view.js"></script>
</body>
</html>
