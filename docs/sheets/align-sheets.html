<section>
  <svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
    <text x="105" y="34" text-anchor="middle" font-size="9" font-weight="700">MUMR mixed reality: line-up spot 1</text>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="30" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="10" fill="none" stroke="#000" stroke-width="0.6"/>
    <line x1="25" y1="150" x2="185" y2="150" stroke="#000" stroke-width="1.2"/>
    <line x1="105" y1="70" x2="105" y2="230" stroke="#000" stroke-width="1.2"/>
    <circle cx="105" cy="150" r="1.6" fill="#c0392b"/>
    <text x="150" y="118" font-size="46" font-weight="700" fill="#c0392b">1</text>
    <text x="105" y="252" text-anchor="middle" font-size="4" fill="#444">Press Line up on your panel. Put an index fingertip on the dot and hold it still</text>
    <text x="105" y="260" text-anchor="middle" font-size="4" fill="#444">until the ring is full. Both players do this, here first.</text>
    <text x="105" y="286" text-anchor="middle" font-size="3.4" fill="#888">Tape the sheet down: it must not move between the two players. Any marked spot on the floor works as well.</text>
  </svg>
</section><section>
  <svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
    <text x="105" y="34" text-anchor="middle" font-size="9" font-weight="700">MUMR mixed reality: line-up spot 2</text>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="30" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="10" fill="none" stroke="#000" stroke-width="0.6"/>
    <line x1="25" y1="150" x2="185" y2="150" stroke="#000" stroke-width="1.2"/>
    <line x1="105" y1="70" x2="105" y2="230" stroke="#000" stroke-width="1.2"/>
    <circle cx="105" cy="150" r="1.6" fill="#c0392b"/>
    <text x="150" y="118" font-size="46" font-weight="700" fill="#c0392b">2</text>
    <text x="105" y="252" text-anchor="middle" font-size="4" fill="#444">Lay this sheet 1.5 to 2 m from sheet 1: the further, the better the two rooms agree.</text>
    <text x="105" y="260" text-anchor="middle" font-size="4" fill="#444">Both players hold a fingertip still on the dot, after spot 1.</text>
    <text x="105" y="286" text-anchor="middle" font-size="3.4" fill="#888">Tape the sheet down: it must not move between the two players. Any marked spot on the floor works as well.</text>
  </svg>
</section><section>
  <svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
    <text x="105" y="34" text-anchor="middle" font-size="9" font-weight="700">MUMR mixed reality: check spot 3</text>
    <circle cx="105" cy="150" r="60" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="30" fill="none" stroke="#000" stroke-width="0.6"/>
    <circle cx="105" cy="150" r="10" fill="none" stroke="#000" stroke-width="0.6"/>
    <line x1="25" y1="150" x2="185" y2="150" stroke="#000" stroke-width="1.2"/>
    <line x1="105" y1="70" x2="105" y2="230" stroke="#000" stroke-width="1.2"/>
    <circle cx="105" cy="150" r="1.6" fill="#2f6fc8"/>
    <text x="150" y="118" font-size="46" font-weight="700" fill="#2f6fc8">3</text>
    <text x="105" y="252" text-anchor="middle" font-size="4" fill="#444">Lay this sheet anywhere else, a metre or more from sheets 1 and 2.</text>
    <text x="105" y="260" text-anchor="middle" font-size="4" fill="#444">One player presses Line up again and holds a fingertip on the dot: a mark appears.</text>
    <text x="105" y="268" text-anchor="middle" font-size="4" fill="#444">The other player looks: the mark should sit on this cross. If it does not, pinch one of</text>
    <text x="105" y="276" text-anchor="middle" font-size="4" fill="#444">your own marks at spot 1 or 2 and move it until it does.</text>
    <text x="105" y="286" text-anchor="middle" font-size="3.4" fill="#888">Tape the sheet down: it must not move between the two players. Any marked spot on the floor works as well.</text>
  </svg>

    <text x="55" y="288" text-anchor="start" font-size="7" font-weight="700" fill="#2f6fc8">4</text>
    <text x="105" y="68" text-anchor="middle" font-size="8" font-weight="700">MUMR mixed reality: field of view</text>
    <text x="105" y="82.0" text-anchor="middle" font-size="3.7" fill="#444">Field-of-view sheet for the webcam page.</text>
    <text x="105" y="87.0" text-anchor="middle" font-size="3.7" fill="#444">Print it at 100 % (no fit to page) and check that the bars are 100 mm long.</text>
    <text x="105" y="97.0" text-anchor="middle" font-size="3.7" fill="#444">In the webcam panel press Measure field of view.</text>
    <text x="105" y="102.0" text-anchor="middle" font-size="3.7" fill="#444">Hold this sheet 0.4 to 0.8 m in front of the camera, leaning back</text>
    <text x="105" y="107.0" text-anchor="middle" font-size="3.7" fill="#444">(its top edge further from the camera than its bottom edge), and keep it still:</text>
    <text x="105" y="112.0" text-anchor="middle" font-size="3.7" fill="#444">the page takes a picture of it by itself.</text>
    <text x="105" y="122.0" text-anchor="middle" font-size="3.7" fill="#444">A yellow outline on the screen shows where to put the sheet next.</text>
    <text x="105" y="127.0" text-anchor="middle" font-size="3.7" fill="#444">Do this at three to five places.</text>
    <text x="105" y="137.0" text-anchor="middle" font-size="3.7" fill="#444">Hold the sheet by the middle of the long edges, or lean it on something:</text>
    <text x="105" y="142.0" text-anchor="middle" font-size="3.7" fill="#444">the four black squares must stay uncovered.</text>
    <text x="105" y="152.0" text-anchor="middle" font-size="3.7" fill="#444">If the page cannot find the squares, press Measure by clicking</text>
    <text x="105" y="157.0" text-anchor="middle" font-size="3.7" fill="#444">and click their centres in the order of their numbers.</text>
    <text x="105" y="167.0" text-anchor="middle" font-size="3.7" fill="#444">Showing this sheet on a screen (a phone) instead of printing it?</text>
    <text x="105" y="172.0" text-anchor="middle" font-size="3.7" fill="#444">Measure each 100 mm bar as it is shown, between its two end lines,</text>
    <text x="105" y="177.0" text-anchor="middle" font-size="3.7" fill="#444">and enter the two numbers in the webcam panel (Bar shown as).</text>
    <text x="105" y="182.0" text-anchor="middle" font-size="3.7" fill="#444">The outline then fits the screen: hold it close to the lens.</text>
    <line x1="55.0" y1="208" x2="155.0" y2="208" stroke="#000" stroke-width="0.8"/>
